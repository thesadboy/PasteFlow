name: 自动编译与 Release 发布

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否直接创建 GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: 构建 macOS 原生应用
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置构建环境权限
        run: |
          chmod +x scripts/*.sh

      - name: 编译并打包应用及 DMG
        run: |
          ./scripts/dist.sh

      - name: 准备打包产物
        run: |
          # 将生成的 DMG 复制并准备压缩归档
          mkdir -p release-artifacts
          cp dist/PasteFlow.dmg release-artifacts/PasteFlow.dmg
          cd dist
          zip -r ../release-artifacts/PasteFlow-macOS.zip PasteFlow.dmg
          cd ..

      - name: 上传构建产物至 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PasteFlow-macOS-Build
          path: release-artifacts/*
          retention-days: 14

      - name: 自动发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/PasteFlow.dmg
            release-artifacts/PasteFlow-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
